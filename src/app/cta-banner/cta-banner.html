<section class="section section--surface cta-banner-section" aria-label="Journey planning invitation">
  <div class="container">
    <div class="cta-banner" aria-labelledby="cta-banner-heading">
      <!-- Scenic Background -->
      <div class="cta-banner__backdrop" aria-hidden="true">
        <img
          src="images/kerala-tea-plantations.jpg"
          alt=""
          class="cta-banner__bg-img"
          loading="lazy"
          width="1600"
          height="700"
        />
        <div class="cta-banner__overlay"></div>
      </div>

      <div class="cta-banner__content reveal">
        <div class="cta-banner__eyebrow">
          <span class="cta-banner__eyebrow-accent" aria-hidden="true"></span>
          <span>START YOUR JOURNEY</span>
        </div>

        <h2 id="cta-banner-heading" class="cta-banner__heading">
          Your next Indian adventure <span class="cta-banner__highlight">starts here.</span>
        </h2>

        <p class="cta-banner__lead">
          Let our travel specialists design a seamless, personalized itinerary tailored to your pace,
          preferences, and style.
        </p>

        <div class="cta-banner__actions">
          <a routerLink="/contact" class="cta-banner__btn cta-banner__btn--primary" aria-label="Plan Your Trip">
            <span>Plan Your Trip</span>
            <span class="cta-banner__btn-icon" aria-hidden="true">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="7" y1="17" x2="17" y2="7"></line>
                <polyline points="7 7 17 7 17 17"></polyline>
              </svg>
            </span>
          </a>
          <a href="#featured-destinations" class="cta-banner__btn cta-banner__btn--secondary" aria-label="Explore Destinations">
            Explore Destinations
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
