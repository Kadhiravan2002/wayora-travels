<section class="hero" aria-labelledby="hero-heading">
  <div class="container hero__container">
    <!-- Left Column: Copy & CTAs -->
    <div class="hero__content">
      <div class="hero__eyebrow">
        <span class="hero__eyebrow-accent" aria-hidden="true"></span>
        <span>YOUR JOURNEY STARTS HERE</span>
      </div>

      <h1 id="hero-heading" class="hero__heading">
        Find your kind of somewhere.
      </h1>

      <p class="hero__description">
        From misty mountains to peaceful backwaters, discover India your way with thoughtfully planned journeys made around you.
      </p>

      <div class="hero__actions">
        <a href="#packages" class="btn btn--primary hero__btn">
          Explore Packages
        </a>
        <a href="#contact" class="btn btn--secondary hero__btn">
          Plan Your Trip
        </a>
      </div>
    </div>

    <!-- Right Column: Visual Imagery -->
    <div class="hero__visual">
      <div class="hero__image-frame">
        <img
          src="images/kerala-tea-plantations.jpg"
          alt="Scenic tropical backwaters and lush greenery of Kerala"
          class="hero__image"
          width="1200"
          height="825"
          fetchpriority="high"
          loading="eager"
        />
        <div class="hero__caption" aria-hidden="true">
          <span class="hero__caption-dot"></span>
          <span>Kerala Backwaters</span>
        </div>
      </div>
    </div>
  </div>
</section>
