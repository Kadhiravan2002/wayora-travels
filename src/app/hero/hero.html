<section class="hero" aria-labelledby="hero-heading">
  <!-- Background Scenic Photograph -->
  <div class="hero__backdrop" aria-hidden="true">
    <img
      src="images/wayora-hero-india.jpg"
      alt=""
      class="hero__bg-img"
      fetchpriority="high"
      loading="eager"
      width="1920"
      height="1080"
    />
    <div class="hero__overlay"></div>
  </div>

  <div class="container hero__container">
    <div class="hero__content">
      <div class="hero__eyebrow">
        <span class="hero__eyebrow-icon" aria-hidden="true">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        </span>
        <span>DISCOVER INDIA WITH WAYORA</span>
      </div>

      <h1 id="hero-heading" class="hero__heading">
        Find your kind of <span class="hero__heading-highlight">somewhere.</span>
      </h1>

      <p class="hero__description">
        From peaceful backwaters and golden deserts to mountain escapes and coastal retreats,
        discover India your way with thoughtfully planned journeys.
      </p>

      <div class="hero__actions">
        <a
          href="#featured-destinations"
          class="hero__btn-primary"
          aria-label="Explore Destinations"
        >
          <span>Explore Destinations</span>
          <span class="hero__btn-icon" aria-hidden="true">
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </span>
        </a>
        <a routerLink="/contact" class="hero__btn-secondary">
          Plan Your Trip
        </a>
      </div>
    </div>
  </div>
</section>
